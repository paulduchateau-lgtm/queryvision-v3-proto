server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Résolution des URLs sans extension ──────────────────────────────
    # /trust-center -> trust-center.html ; /en/ -> en/index.html
    # Remplace le try_files de la SPA : un chemin inconnu doit rendre 404,
    # pas la page d'accueil.
    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;
    }

    # ── Continuité des URLs indexées ────────────────────────────────────
    # Ces deux pages de l'ancien site sont désormais des sections de
    # /entreprise. On les redirige plutôt que de perdre leur référencement.
    location = /partenaires   { return 301 /entreprise#partenaires; }
    location = /implantations { return 301 /entreprise#implantations; }

    # ── Cache ───────────────────────────────────────────────────────────
    # Le HTML doit pouvoir changer à chaque déploiement ; les fichiers
    # d'actifs sont versionnés par l'image, on peut les garder longtemps.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /sitemap.xml { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt  { add_header Cache-Control "public, max-age=3600"; }
    location = /llms.txt    { add_header Cache-Control "public, max-age=3600"; }

    # ── En-têtes de sécurité ────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Compression ─────────────────────────────────────────────────────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml;

    error_page 404 /404.html;
    location = /404.html { internal; }
}
