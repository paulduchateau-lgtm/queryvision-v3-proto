# Bascule de dev.query.vision sur le site statique (branche proto/website-v3).
#
# Volontairement SÉPARÉ de publish-dev.yml, qui construit l'application React
# depuis main. main et la production ne sont pas touchées : seul
# l'environnement dev change d'image.
#
# Le déploiement est en GitOps : pousser l'image au registre ne suffit pas,
# c'est le champ `newTag` de queryvision-ai/kube-apps qui décide de ce que
# sert le cluster. On reprend donc le mécanisme de publish-dev.yml.
name: Publish proto to dev

on:
  push:
    branches: [proto/website-v3]
  workflow_dispatch:

env:
  SCW_CLI_VERSION: v2.60.0
  GIT_SHA: ${{ github.sha }}
  SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY_ID }}
  SCW_SECRET_KEY: ${{ secrets.SCW_ACCESS_KEY_SECRET }}
  SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
  SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

jobs:
  check:
    name: Check
    # Le miroir personnel n'a ni secrets Scaleway ni environnement `dev`.
    if: github.repository == 'queryvision-ai/official-website'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Liens, ancres, hreflang, canonical
        run: python3 tools/check_site.py

  deploy:
    name: Deploy proto to dev
    needs: check
    environment: dev
    runs-on: ubuntu-latest
    permissions:
      deployments: write
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: chrnorm/deployment-action@v2
        name: Create GitHub deployment
        id: deployment
        with:
          token: '${{ github.token }}'
          environment-url: ${{ vars.WEBSITE_URL }}
          environment: dev

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          repositories: kube-apps

      - name: Install the Scaleway CLI
        uses: scaleway/action-scw@v0
        with:
          version: ${{ env.SCW_CLI_VERSION }}

      # Pas de tag `latest` : l'application React et le site statique
      # partagent ce dépôt d'images. Le préfixe proto- les distingue, un
      # `latest` partagé les confondrait.
      - name: Build and push docker image
        id: build
        run: |
          set -euo pipefail
          IMAGE_TAG="proto-${GIT_SHA:0:7}"
          ENDPOINT=$(scw registry namespace list name=${{ vars.REGISTRY_NAME }} \
            --output=json | jq -r '.[0].endpoint')
          REF="${ENDPOINT}/${{ vars.IMAGE_NAME }}"

          scw registry login program=docker
          docker buildx build -t "${REF}:${IMAGE_TAG}" .
          docker push "${REF}:${IMAGE_TAG}"

          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout kube-apps
        uses: actions/checkout@v6
        with:
          repository: queryvision-ai/kube-apps
          token: ${{ steps.app-token.outputs.token }}
          path: .kube-apps

      # Pousser l'image ne change rien : c'est ce champ qui décide de ce
      # que sert le cluster. On vérifie que la substitution a bien eu lieu
      # plutôt que de faire confiance à sed — un « succès » qui ne déploie
      # rien est pire qu'un échec.
      - name: Update newTag
        working-directory: .kube-apps
        run: |
          set -euo pipefail
          FILE=overlays/dev/shared/official-website/kustomization.yaml
          TAG="${{ steps.build.outputs.image-tag }}"

          sed -i "s|newTag: \".*\"|newTag: \"${TAG}\"|" "$FILE"

          if ! grep -q "newTag: \"${TAG}\"" "$FILE"; then
            echo "::error::newTag n'a pas été mis à jour dans ${FILE}."
            cat "$FILE"
            exit 1
          fi
          grep -n "newTag" "$FILE"

      - name: Commit and push
        working-directory: .kube-apps
        run: |
          set -euo pipefail
          git config user.name "QueryVisionBot"
          git config user.email "queryvision-bot@github.com"
          git add overlays/dev/shared/official-website/kustomization.yaml
          if git diff --cached --quiet; then
            echo "dev sert déjà cette image, rien à pousser."
            exit 0
          fi
          git commit -m "chore(official-website): bascule dev sur le site statique ${{ steps.build.outputs.image-tag }}"
          git push origin HEAD

      - name: Update deployment status (success)
        if: success()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deployment.outputs.environment_url }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'success'

      - name: Update deployment status (failure)
        if: failure()
        uses: chrnorm/deployment-status@v2
        with:
          token: '${{ github.token }}'
          environment-url: ${{ steps.deployment.outputs.environment_url }}
          deployment-id: ${{ steps.deployment.outputs.deployment_id }}
          state: 'failure'
