<svg width="680" height="416" viewBox="0 0 680 416" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Mockup de discussion en langage naturel Qvision</title>
<desc>Carte bleu-gris foncé montrant une question en langage naturel, une réponse IA avec un mini graphique en anneau, et une barre de saisie.</desc>
<rect x="40" y="20" width="600" height="376" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
<text x="70" y="56" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="1.8" fill="#03CF65">DISCUSSION</text>
<rect x="288" y="74" width="322" height="44" rx="14" fill="#0E131A"/>
<text x="594" y="101" text-anchor="end" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#EDF1F4">Quelle ville concentre le plus de risques ?</text>
<rect x="70" y="140" width="470" height="110" rx="14" fill="#232E3E" stroke="#2E3A49" stroke-width="1"/>
<circle cx="92" cy="166" r="9" fill="#03CF65"/>
<path d="M89 166 l2 -5 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 z" fill="#1C2431"/>
<text x="112" y="162" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#C3CCD6">D'après les données agrégées de l'exercice,</text>
<text x="112" y="184" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#C3CCD6">deux villes concentrent l'essentiel du risque</text>
<text x="112" y="206" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#C3CCD6">de niveau élevé (≈ 50 % du total).</text>
<text x="112" y="234" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">réponse générée</text>
<g transform="rotate(-90 495 192)">
<circle cx="495" cy="192" r="24" fill="none" stroke="#2C3848" stroke-width="9"/>
<circle cx="495" cy="192" r="24" fill="none" stroke="#B3ABF2" stroke-width="9" stroke-dasharray="72 79"/>
<circle cx="495" cy="192" r="24" fill="none" stroke="#8C84D8" stroke-width="9" stroke-dasharray="45 106" stroke-dashoffset="-72"/>
<circle cx="495" cy="192" r="24" fill="none" stroke="#6F68B8" stroke-width="9" stroke-dasharray="33 118" stroke-dashoffset="-117"/>
</g>
<text x="495" y="236" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F">répartition</text>
<rect x="70" y="300" width="540" height="78" rx="12" fill="#19212C" stroke="#2E3A49" stroke-width="1"/>
<text x="90" y="332" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#67737F">Posez une question à vos données…</text>
<text x="92" y="368" font-family="-apple-system,'Inter',sans-serif" font-size="16" fill="#8C99A8">+</text>
<text x="116" y="365" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8">◇ analyse-risques  ▾</text>
<rect x="566" y="348" width="30" height="22" rx="7" fill="#03CF65"/>
<path d="M575 359 h9 m-3 -3 l3 3 l-3 3" fill="none" stroke="#06301C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
