<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Rapport compliance Q2 2025</title>
  <desc>Mise en page du rapport de conformité périodique prêt à soumettre</desc>
  <!-- Card background -->
  <rect x="40" y="24" width="600" height="392" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header title -->
  <text x="70" y="58" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Rapport compliance Q2 2025</text>
  <!-- Tag top-right -->
  <text x="610" y="58" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#03CF65" text-anchor="end">PRÊT À SOUMETTRE</text>
  <!-- Separator -->
  <line x1="70" y1="78" x2="610" y2="78" stroke="#2B3543" stroke-width="1"/>

  <!-- Metric box 1: TAUX GLOBAL -->
  <rect x="70" y="92" width="172" height="100" rx="8" fill="#18242F" stroke="#263040" stroke-width="1"/>
  <text x="84" y="113" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#03CF65">TAUX GLOBAL</text>
  <text x="84" y="148" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#EDF1F4">72%</text>
  <text x="84" y="173" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#03CF65">vs 68% Q1  ↑</text>

  <!-- Metric box 2: NON-CONFORMITÉS -->
  <rect x="254" y="92" width="172" height="100" rx="8" fill="#18242F" stroke="#263040" stroke-width="1"/>
  <text x="268" y="113" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#8C99A8">NON-CONFORMITÉS</text>
  <text x="268" y="148" font-family="Georgia,'Times New Roman',serif" font-size="28" fill="#EDF1F4">7</text>
  <text x="268" y="173" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#D07070">+2 vs Q1  ↑</text>

  <!-- Metric box 3: PROCHAINE ÉCHÉANCE -->
  <rect x="438" y="92" width="172" height="100" rx="8" fill="#18242F" stroke="#263040" stroke-width="1"/>
  <text x="452" y="113" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#8C99A8">PROCHAINE ÉCHÉANCE</text>
  <text x="452" y="146" font-family="Georgia,'Times New Roman',serif" font-size="24" fill="#EDF1F4">15 juil</text>
  <text x="452" y="173" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">SOL II — ORSA</text>

  <!-- Section: Points d'attention -->
  <text x="70" y="220" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#EDF1F4">Points d'attention</text>
  <!-- Red bullet item 1 -->
  <rect x="70" y="232" width="7" height="7" rx="1" fill="#D07070"/>
  <text x="84" y="241" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">Formation AML 2024 non réalisée — 23 collaborateurs concernés</text>
  <!-- Amber bullet item 2 -->
  <rect x="70" y="254" width="7" height="7" rx="1" fill="#C89432"/>
  <text x="84" y="263" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">DORA : cartographie TPPI incomplète (61%)</text>

  <!-- Section separator -->
  <line x1="70" y1="280" x2="610" y2="280" stroke="#2B3543" stroke-width="1"/>

  <!-- Section: Prêt à exporter -->
  <text x="70" y="302" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#EDF1F4">Prêt à exporter</text>
  <!-- Checkmark item 1 -->
  <text x="70" y="322" font-family="'JetBrains Mono',monospace" font-size="12" fill="#03CF65">✓</text>
  <text x="88" y="322" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">SFCR narratif</text>
  <!-- Checkmark item 2 -->
  <text x="220" y="322" font-family="'JetBrains Mono',monospace" font-size="12" fill="#03CF65">✓</text>
  <text x="238" y="322" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">Rapport DPO annuel</text>
  <!-- Checkmark item 3 -->
  <text x="396" y="322" font-family="'JetBrains Mono',monospace" font-size="12" fill="#03CF65">✓</text>
  <text x="414" y="322" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">Déclaration de conformité AML</text>

  <!-- Bottom separator -->
  <line x1="70" y1="376" x2="610" y2="376" stroke="#2B3543" stroke-width="1"/>
  <!-- Footer -->
  <text x="70" y="398" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">Rapport généré automatiquement · approbation requise</text>
  <!-- Download button -->
  <rect x="488" y="385" width="122" height="24" rx="5" fill="#122A1C"/>
  <text x="549" y="401" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="middle">Télécharger PDF</text>
</svg>
