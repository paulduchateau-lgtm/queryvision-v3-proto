<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Análisis de desviaciones presupuestarias</title>
  <desc>Desviaciones Presupuesto/Real por centro de coste — junio 2025: 3 sobrecostes detectados por la IA</desc>
  <!-- Card background -->
  <rect x="40" y="24" width="600" height="392" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header -->
  <text x="70" y="58" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Presupuesto vs Real — Junio 2025</text>
  <text x="610" y="58" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#D07070" text-anchor="end">3 SOBRECOSTES</text>
  <line x1="70" y1="74" x2="610" y2="74" stroke="#2B3543" stroke-width="1"/>
  <!-- Column headers -->
  <text x="86" y="96" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#67737F">CENTRO DE COSTE</text>
  <text x="360" y="96" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#67737F">REAL vs PRESUPUESTO</text>
  <text x="610" y="96" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1" fill="#67737F" text-anchor="end">DESVIACIÓN</text>
  <line x1="70" y1="104" x2="610" y2="104" stroke="#2B3543" stroke-width="1"/>

  <!-- Row 1: RH & Recrutement — +12% over budget (red, most over) -->
  <text x="86" y="128" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#EDF1F4">RRHH &amp; Selección</text>
  <!-- axis at x=360, bar goes right for over-budget -->
  <rect x="360" y="116" width="96" height="16" rx="3" fill="#B24B4B" fill-opacity="0.85"/>
  <text x="610" y="128" font-family="'JetBrains Mono',monospace" font-size="13" fill="#D07070" text-anchor="end">+12,4 %</text>

  <!-- Row 2: IT & Infra — +8% over budget -->
  <text x="86" y="160" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#EDF1F4">IT &amp; Infra</text>
  <rect x="360" y="148" width="64" height="16" rx="3" fill="#B24B4B" fill-opacity="0.7"/>
  <text x="610" y="160" font-family="'JetBrains Mono',monospace" font-size="13" fill="#D07070" text-anchor="end">+8,1 %</text>

  <!-- Row 3: Marketing — +2.4% slight over -->
  <text x="86" y="192" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#EDF1F4">Marketing</text>
  <rect x="360" y="180" width="19" height="16" rx="3" fill="#C89432" fill-opacity="0.7"/>
  <text x="610" y="192" font-family="'JetBrains Mono',monospace" font-size="13" fill="#C89432" text-anchor="end">+2,4 %</text>

  <!-- Axis line -->
  <line x1="360" y1="104" x2="360" y2="320" stroke="#3A4857" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Row 4: Finance & Legal — +0.8% near flat -->
  <text x="86" y="224" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#CDD4DC">Finanzas &amp; Legal</text>
  <rect x="360" y="212" width="6" height="16" rx="2" fill="#67737F" fill-opacity="0.6"/>
  <text x="610" y="224" font-family="'JetBrains Mono',monospace" font-size="13" fill="#8C99A8" text-anchor="end">+0,8 %</text>

  <!-- Row 5: Commercial — −3.5% under budget (green) -->
  <text x="86" y="256" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#CDD4DC">Comercial</text>
  <rect x="332" y="244" width="28" height="16" rx="3" fill="#1E7A50" fill-opacity="0.75"/>
  <text x="610" y="256" font-family="'JetBrains Mono',monospace" font-size="13" fill="#03CF65" text-anchor="end">−3,5 %</text>

  <!-- Row 6: Opérations — −5.8% under budget (green) -->
  <text x="86" y="288" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#CDD4DC">Operaciones</text>
  <rect x="313" y="276" width="47" height="16" rx="3" fill="#1E7A50" fill-opacity="0.9"/>
  <text x="610" y="288" font-family="'JetBrains Mono',monospace" font-size="13" fill="#03CF65" text-anchor="end">−5,8 %</text>

  <!-- Scale labels -->
  <text x="410" y="325" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="middle">+5 %</text>
  <text x="460" y="325" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="middle">+10 %</text>
  <text x="310" y="325" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="middle">−5 %</text>
  <text x="360" y="325" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="middle">0 %</text>

  <!-- AI badge -->
  <rect x="70" y="334" width="222" height="30" rx="6" fill="#1A2B3A" stroke="#293A4A" stroke-width="1"/>
  <text x="86" y="354" font-family="'JetBrains Mono',monospace" font-size="11" fill="#03CF65">IA · Drill-down disponible</text>

  <!-- Footer -->
  <line x1="70" y1="380" x2="610" y2="380" stroke="#2B3543" stroke-width="1"/>
  <text x="70" y="399" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">Fuente SAP CO · Datos a 30/06/2025 · Presupuesto validado ene. 2025</text>
</svg>
