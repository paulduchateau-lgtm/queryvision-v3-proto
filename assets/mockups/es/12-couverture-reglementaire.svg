<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Cobertura regulatoria — Tasa por referencial</title>
  <desc>Barras de progreso horizontales por referencial regulatorio</desc>
  <!-- Card background -->
