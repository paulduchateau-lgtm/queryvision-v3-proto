  <text x="265" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8"> · </text>
  <text x="276" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C89432">16 en curso</text>
  <text x="360" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8"> · </text>
  <text x="371" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#D07070">7 atrasadas</text>
  <text x="610" y="358" font-family="'JetBrains Mono',monospace" font-size="11" fill="#EDF1F4" text-anchor="end">Puntuación global: 72%</text>
