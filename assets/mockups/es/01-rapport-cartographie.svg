<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Discusión — Mapa de procesos QueryVision</title>
  <desc>Interfaz de chat: diagrama de flujo horizontal con cajas coloreadas por tipo VA/NVA/control</desc>

  <!-- Card -->
  <rect x="40" y="24" width="600" height="392" rx="16" fill="#0F1822" stroke="#1C2838" stroke-width="1"/>

  <!-- Label DISCUSSION -->
  <text x="62" y="52" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" letter-spacing="2">DISCUSIÓN</text>
  <line x1="62" y1="60" x2="618" y2="60" stroke="#1C2838" stroke-width="0.5"/>

  <!-- ─── User bubble (right) ─── -->
  <rect x="274" y="68" width="330" height="28" rx="14" fill="#1C2D40"/>
  <text x="590" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C8D4E0" text-anchor="end">Muestra el mapa del proceso de Tarificación</text>

  <!-- ─── AI avatar ─── -->
  <circle cx="68" cy="128" r="13" fill="#03CF65"/>
  <text x="68" y="133" font-family="'JetBrains Mono',monospace" font-size="12" fill="#0B0F14" text-anchor="middle" font-weight="bold">↑</text>

  <!-- ─── AI bubble ─── -->
  <rect x="90" y="108" width="510" height="238" rx="10" fill="#141F2C" stroke="#1C2838" stroke-width="1"/>

  <!-- Bubble header -->
  <text x="108" y="126" font-family="-apple-system,'Inter',sans-serif" font-size="11.5" fill="#8C99A8">Mapa generado · 13 expedientes analizados · modelo fusionado</text>
  <line x1="108" y1="134" x2="582" y2="134" stroke="#1C2838" stroke-width="0.5"/>

  <!-- ═══ FLOWCHART HORIZONTAL (centre y=178) ═══ -->
  <!-- Boxes h=34, y=161→195 — 1 seul label par case, fond coloré par type -->

  <!-- RÉCEPTION — bleu (NVA admin) -->
  <rect x="104" y="161" width="68" height="34" rx="5" fill="#0E2740" stroke="#1C4060" stroke-width="1"/>
  <text x="138" y="183" font-family="-apple-system,'Inter',sans-serif" font-size="10" font-weight="bold" fill="#A8C4DC" text-anchor="middle">RECEPCIÓN</text>

  <!-- Arrow + count -->
  <line x1="172" y1="178" x2="183" y2="178" stroke="#3A4A5C" stroke-width="1.5"/>
  <polygon points="183,174 189,178 183,182" fill="#3A4A5C"/>
  <text x="181" y="171" font-family="'JetBrains Mono',monospace" font-size="7" fill="#586070" text-anchor="middle">13</text>

  <!-- ANALYSE — bleu-cyan (processus) -->
  <rect x="189" y="161" width="68" height="34" rx="5" fill="#0A2A3C" stroke="#1A4A5C" stroke-width="1"/>
  <text x="223" y="183" font-family="-apple-system,'Inter',sans-serif" font-size="10" font-weight="bold" fill="#90C4CC" text-anchor="middle">ANÁLISIS</text>

  <!-- Arrow → diamond -->
  <line x1="257" y1="178" x2="271" y2="178" stroke="#3A4A5C" stroke-width="1.5"/>

  <!-- Diamond CONFORME? cx=291, cy=178, half=20 -->
  <polygon points="291,158 311,178 291,198 271,178" fill="#182030" stroke="#3A4A5C" stroke-width="1.5"/>
  <text x="291" y="175" font-family="-apple-system,'Inter',sans-serif" font-size="9" fill="#8C99A8" text-anchor="middle">Conf.</text>
  <text x="291" y="188" font-family="-apple-system,'Inter',sans-serif" font-size="9" fill="#8C99A8" text-anchor="middle">?</text>

  <!-- OUI arrow -->
  <line x1="311" y1="178" x2="323" y2="178" stroke="#3A4A5C" stroke-width="1.5"/>
  <polygon points="323,174 329,178 323,182" fill="#3A4A5C"/>
  <text x="317" y="170" font-family="'JetBrains Mono',monospace" font-size="7" fill="#586070" text-anchor="middle">sí·5</text>

  <!-- TARIFICATION — vert (VA cœur) -->
  <rect x="329" y="161" width="80" height="34" rx="5" fill="#0A2818" stroke="#03CF65" stroke-width="1.5"/>
  <text x="369" y="183" font-family="-apple-system,'Inter',sans-serif" font-size="10" font-weight="bold" fill="#6EE8A8" text-anchor="middle">TARIFICACIÓN</text>

  <!-- Arrow TARIFICATION → VALIDATION -->
  <line x1="409" y1="178" x2="421" y2="178" stroke="#3A4A5C" stroke-width="1.5"/>
  <polygon points="421,174 427,178 421,182" fill="#3A4A5C"/>

  <!-- VALIDATION — violet (contrôle) -->
  <rect x="427" y="161" width="72" height="34" rx="5" fill="#1A1240" stroke="#3828A0" stroke-width="1"/>
  <text x="463" y="183" font-family="-apple-system,'Inter',sans-serif" font-size="10" font-weight="bold" fill="#A89CE0" text-anchor="middle">VALIDACIÓN</text>

  <!-- Arrow VALIDATION → CLÔTURE -->
  <line x1="499" y1="178" x2="511" y2="178" stroke="#3A4A5C" stroke-width="1.5"/>
  <polygon points="511,174 517,178 511,182" fill="#3A4A5C"/>

  <!-- CLÔTURE — bleu (NVA admin) -->
  <rect x="517" y="161" width="66" height="34" rx="5" fill="#0E2740" stroke="#1C4060" stroke-width="1"/>
  <text x="550" y="183" font-family="-apple-system,'Inter',sans-serif" font-size="10" font-weight="bold" fill="#A8C4DC" text-anchor="middle">CIERRE</text>

  <!-- NON branch: diamond bottom → RENVOI -->
  <line x1="291" y1="198" x2="291" y2="214" stroke="#B8831A" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="287,214 291,220 295,214" fill="#B8831A"/>
  <text x="303" y="210" font-family="'JetBrains Mono',monospace" font-size="7" fill="#B8831A">no · 8</text>

  <!-- RENVOI — ambre (NVA rework) -->
  <rect x="260" y="220" width="62" height="22" rx="5" fill="#281808" stroke="#B8831A" stroke-width="1"/>
  <text x="291" y="235" font-family="-apple-system,'Inter',sans-serif" font-size="10" font-weight="bold" fill="#D4A050" text-anchor="middle">REENVÍO</text>

  <!-- ─── Summary ─── -->
  <text x="108" y="264" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">8 / 13 expedientes devueltos a análisis · Lead time +Δ 3d · 1 REWORK observado</text>

  <!-- Legend -->
  <rect x="108" y="276" width="8" height="8" rx="2" fill="#0A2818" stroke="#03CF65" stroke-width="1"/>
  <text x="120" y="284" font-family="'JetBrains Mono',monospace" font-size="8" fill="#586070">VA</text>
  <rect x="140" y="276" width="8" height="8" rx="2" fill="#0A2A3C" stroke="#1A4A5C" stroke-width="1"/>
  <text x="152" y="284" font-family="'JetBrains Mono',monospace" font-size="8" fill="#586070">Proceso</text>
  <rect x="218" y="276" width="8" height="8" rx="2" fill="#1A1240" stroke="#3828A0" stroke-width="1"/>
  <text x="230" y="284" font-family="'JetBrains Mono',monospace" font-size="8" fill="#586070">Control</text>
  <rect x="290" y="276" width="8" height="8" rx="2" fill="#0E2740" stroke="#1C4060" stroke-width="1"/>
  <text x="302" y="284" font-family="'JetBrains Mono',monospace" font-size="8" fill="#586070">Admin</text>
  <rect x="352" y="276" width="8" height="8" rx="2" fill="#281808" stroke="#B8831A" stroke-width="1"/>
  <text x="364" y="284" font-family="'JetBrains Mono',monospace" font-size="8" fill="#586070">Rework</text>

  <!-- réponse générée -->
  <text x="108" y="334" font-family="-apple-system,'Inter',sans-serif" font-size="10" fill="#3A4A5C" font-style="italic">respuesta generada · 13 expedientes · confianza 91 %</text>

  <!-- ─── Input bar ─── -->
  <rect x="58" y="360" width="524" height="34" rx="10" fill="#111A26" stroke="#1C2838" stroke-width="1"/>
  <text x="76" y="382" font-family="-apple-system,'Inter',sans-serif" font-size="17" fill="#3A4A5C" text-anchor="middle">+</text>
  <rect x="90" y="369" width="130" height="16" rx="8" fill="#182030"/>
  <text x="156" y="381" font-family="'JetBrains Mono',monospace" font-size="8" fill="#586070" text-anchor="middle">◇ mapa-procesos</text>
  <text x="232" y="382" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#2E3C4C">Pregunte a sus datos...</text>
  <rect x="552" y="366" width="24" height="22" rx="6" fill="#03CF65"/>
  <text x="564" y="381" font-family="-apple-system,'Inter',sans-serif" font-size="14" fill="#0B0F14" text-anchor="middle" font-weight="bold">→</text>
</svg>
