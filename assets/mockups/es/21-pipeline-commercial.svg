<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Analyse du churn client — T2 2025</title>
  <desc>Interface de chat QueryVision : analyse du taux de churn par segment avec visualisation IA</desc>
  <rect x="40" y="24" width="600" height="392" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>

  <!-- Header -->
  <text x="70" y="58" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Análisis de la fuga de clientes</text>
  <text x="610" y="58" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8C99A8" text-anchor="end">T2 2025</text>
  <line x1="70" y1="74" x2="610" y2="74" stroke="#2B3543" stroke-width="1"/>

  <!-- Query bar -->
  <rect x="70" y="88" width="540" height="36" rx="8" fill="#131C27" stroke="#2B3543" stroke-width="1"/>
  <text x="86" y="110" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">Analiza la tasa de fuga por segmento — T2 2025</text>
  <rect x="570" y="94" width="28" height="24" rx="5" fill="#03CF65"/>
  <text x="584" y="110" font-family="-apple-system,'Inter',sans-serif" font-size="14" fill="#131C27" text-anchor="middle" font-weight="bold">↵</text>

  <!-- Response panel -->
  <rect x="70" y="136" width="540" height="198" rx="8" fill="#18242F" stroke="#263040" stroke-width="1"/>

  <!-- Panel label -->
  <text x="86" y="156" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.5" fill="#03CF65">▸ TASA DE FUGA — T2 2025</text>
  <line x1="86" y1="164" x2="594" y2="164" stroke="#263040" stroke-width="1"/>

  <!-- Big metric -->
  <text x="86" y="196" font-family="Georgia,'Times New Roman',serif" font-size="36" fill="#EDF1F4">4,2 %</text>
  <!-- Trend (right) -->
  <text x="594" y="181" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C89432" text-anchor="end">↑ +0,8 pt vs T1</text>
  <text x="594" y="197" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#67737F" text-anchor="end">1.886 clientes analizados</text>

  <line x1="86" y1="210" x2="594" y2="210" stroke="#263040" stroke-width="0.5"/>

  <!-- Column headers -->
  <text x="194" y="226" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="end">SEGMENTO</text>
  <text x="200" y="226" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668">TASA DE FUGA</text>
  <text x="594" y="226" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="end">EVOLUCIÓN</text>

  <!-- Bars: x=200→452 (252px max for 6% → 42px/%) -->

  <!-- Row 1: PME · 3,0% → 126px (amber) -->
  <text x="194" y="244" font-family="-apple-system,'Inter',sans-serif" font-size="12" font-weight="bold" fill="#C3CCD6" text-anchor="end">PYME</text>
  <text x="194" y="257" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="end">1.247 cl.</text>
  <rect x="200" y="232" width="252" height="16" rx="2" fill="#C89432" fill-opacity="0.08"/>
  <rect x="200" y="232" width="126" height="16" rx="2" fill="#C89432" fill-opacity="0.65"/>
  <text x="334" y="244" font-family="'JetBrains Mono',monospace" font-size="11" fill="#C89432">3,0 %</text>
  <text x="594" y="244" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8" text-anchor="end">→ estable</text>

  <!-- Row 2: ETI · 6,0% → 252px (red) -->
  <text x="194" y="276" font-family="-apple-system,'Inter',sans-serif" font-size="12" font-weight="bold" fill="#C3CCD6" text-anchor="end">Mediana empresa</text>
  <text x="194" y="289" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="end">483 cl.</text>
  <rect x="200" y="264" width="252" height="16" rx="2" fill="#B24B4B" fill-opacity="0.08"/>
  <rect x="200" y="264" width="252" height="16" rx="2" fill="#B24B4B" fill-opacity="0.7"/>
  <text x="458" y="276" font-family="'JetBrains Mono',monospace" font-size="11" fill="#D07070">6,0 %</text>
  <text x="594" y="276" font-family="'JetBrains Mono',monospace" font-size="11" fill="#D07070" text-anchor="end">↑ +1,1 pt</text>

  <!-- Row 3: GE · 3,2% → 134px (green) -->
  <text x="194" y="308" font-family="-apple-system,'Inter',sans-serif" font-size="12" font-weight="bold" fill="#C3CCD6" text-anchor="end">Gran empresa</text>
  <text x="194" y="321" font-family="'JetBrains Mono',monospace" font-size="9" fill="#4A5668" text-anchor="end">156 cl.</text>
  <rect x="200" y="296" width="252" height="16" rx="2" fill="#1E7A50" fill-opacity="0.08"/>
  <rect x="200" y="296" width="134" height="16" rx="2" fill="#1E7A50" fill-opacity="0.65"/>
  <text x="342" y="308" font-family="'JetBrains Mono',monospace" font-size="11" fill="#03CF65">3,2 %</text>
  <text x="594" y="308" font-family="'JetBrains Mono',monospace" font-size="11" fill="#03CF65" text-anchor="end">↓ −0,2 pt</text>

  <!-- Panel source + CTA -->
  <line x1="86" y1="322" x2="594" y2="322" stroke="#263040" stroke-width="0.5"/>
  <text x="86" y="337" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4A5668">Fuente CRM · Periodo: 01/04–30/06/2025</text>
  <rect x="456" y="326" width="138" height="20" rx="4" fill="#122A1C"/>
  <text x="525" y="339" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="middle">Ver las 3 cuentas en riesgo</text>

  <!-- Footer -->
  <line x1="70" y1="356" x2="610" y2="356" stroke="#2B3543" stroke-width="1"/>
  <text x="70" y="372" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">QueryVision · análisis auditado · modelo v2.4 · confianza 96 %</text>
</svg>
