<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Regulatorische Analyse — DSGVO-Abfrage</title>
  <desc>Abfrageoberfläche für die Analyse der regulatorischen Konformität nach DSGVO und AML</desc>
  <!-- Card background -->
  <rect x="40" y="24" width="600" height="392" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header title -->
  <text x="70" y="58" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Regulatorische Analyse</text>
  <!-- Tag top-right -->
  <text x="610" y="58" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#03CF65" text-anchor="end">DSGVO · AML</text>
  <!-- Separator -->
  <line x1="70" y1="78" x2="610" y2="78" stroke="#2B3543" stroke-width="1"/>
  <!-- Query input bar -->
  <rect x="70" y="92" width="540" height="38" rx="8" fill="#131C27" stroke="#2B3543" stroke-width="1"/>
  <text x="86" y="116" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">Wie viele DSGVO-Pflichten sind in Q2 2025 nicht konform?</text>
  <!-- Submit button -->
  <rect x="574" y="98" width="28" height="26" rx="5" fill="#03CF65"/>
  <text x="588" y="115" font-family="-apple-system,'Inter',sans-serif" font-size="14" fill="#131C27" text-anchor="middle" font-weight="bold">↵</text>
  <!-- Answer panel -->
  <rect x="70" y="142" width="540" height="230" rx="8" fill="#18242F" stroke="#263040" stroke-width="1"/>
  <!-- Label RÉPONSE INSTANTANÉE -->
  <text x="86" y="165" font-family="'JetBrains Mono',monospace" font-size="10" letter-spacing="1.5" fill="#03CF65">▸ SOFORTANTWORT</text>
  <!-- Big number -->
  <text x="86" y="218" font-family="Georgia,'Times New Roman',serif" font-size="52" fill="#EDF1F4">3</text>
  <!-- Descriptions beside number -->
  <text x="138" y="200" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#EDF1F4">nicht konforme Pflichten</text>
  <text x="138" y="218" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8">von 18 aktiven DSGVO-Pflichten in Q2 2025</text>
  <!-- Inner separator -->
  <line x1="86" y1="232" x2="594" y2="232" stroke="#263040" stroke-width="1"/>
  <!-- Finding 1 -->
  <rect x="86" y="243" width="7" height="7" rx="1" fill="#D07070"/>
  <text x="101" y="252" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">2 Verarbeitungen ohne dokumentierte Rechtsgrundlage</text>
  <text x="101" y="267" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">Art. 6 DSGVO · Einheiten FR-SUD, DE-WEST</text>
  <!-- Finding 2 -->
  <rect x="86" y="278" width="7" height="7" rx="1" fill="#D07070"/>
  <text x="101" y="287" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6">1 KI-Verarbeitung ohne vorherige DSB-Konsultation</text>
  <text x="101" y="302" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">Art. 35 DSGVO · Projekt CRM v3.2</text>
  <!-- Bottom separator of answer panel -->
  <line x1="86" y1="316" x2="594" y2="316" stroke="#263040" stroke-width="1"/>
  <!-- Source line -->
  <text x="86" y="333" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">Quelle: Verarbeitungsverzeichnis · 12.06.2025</text>
  <!-- Exporter button -->
  <rect x="536" y="322" width="58" height="22" rx="4" fill="#122A1C"/>
  <text x="565" y="337" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="middle">Export</text>
  <!-- Card footer -->
  <text x="70" y="395" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">Abfrage auditiert · Verlauf 5 Jahre aufbewahrt</text>
  <text x="610" y="395" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="end">↗ Alle Pflichten anzeigen</text>
</svg>
