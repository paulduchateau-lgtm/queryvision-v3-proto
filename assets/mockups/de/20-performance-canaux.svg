<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <title>Performance commerciale par canal Q2 2025</title>
  <desc>Comparaison de la performance commerciale par canal avec barres groupées CA réalisé vs objectif</desc>
  <!-- Card background -->
  <rect x="40" y="16" width="600" height="368" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header title -->
  <text x="70" y="50" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Vertriebsleistung nach Kanal</text>
  <!-- Tag top-right -->
  <text x="610" y="50" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8C99A8" text-anchor="end">Q2 2025</text>
  <!-- Separator -->
  <line x1="70" y1="66" x2="610" y2="66" stroke="#2B3543" stroke-width="1"/>

  <!-- Legend -->
  <rect x="70" y="76" width="10" height="10" fill="#8C84D8"/>
  <text x="86" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Ist-Umsatz</text>
  <rect x="172" y="76" width="10" height="10" fill="#515C68"/>
  <text x="188" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Ziel</text>

  <!-- Chart: y=280 baseline (0), y=100 top (2.5M), scale=72px per 1M€ -->
  <!-- Grid lines -->
  <line x1="90" y1="280" x2="620" y2="280" stroke="#28323F" stroke-width="1"/>
  <line x1="90" y1="244" x2="620" y2="244" stroke="#28323F" stroke-width="1"/>
  <line x1="90" y1="208" x2="620" y2="208" stroke="#28323F" stroke-width="1"/>
  <line x1="90" y1="172" x2="620" y2="172" stroke="#28323F" stroke-width="1"/>
  <line x1="90" y1="136" x2="620" y2="136" stroke="#28323F" stroke-width="1"/>
  <line x1="90" y1="100" x2="620" y2="100" stroke="#28323F" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="84" y="283" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">0</text>
  <text x="84" y="247" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">0,5 Mio.</text>
  <text x="84" y="211" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">1 Mio.</text>
  <text x="84" y="175" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">1,5 Mio.</text>
  <text x="84" y="139" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">2 Mio.</text>
  <text x="84" y="103" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">2,5 Mio.</text>

  <!-- Group 1: Inbound SEO — réalisé=1.2M(86px), obj=1.0M(72px) — over target -->
  <!-- Bars centered around x=138 -->
  <rect x="108" y="194" width="22" height="86" rx="2" fill="#8C84D8"/>
  <rect x="134" y="208" width="22" height="72" rx="2" fill="#515C68"/>
  <text x="131" y="298" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Inbound</text>
  <text x="131" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">SEO</text>
  <text x="131" y="322" font-family="'JetBrains Mono',monospace" font-size="9" fill="#03CF65" text-anchor="middle">+20 %</text>

  <!-- Group 2: Outbound — réalisé=0.8M(58px), obj=1.1M(79px) — under target -->
  <rect x="216" y="222" width="22" height="58" rx="2" fill="#8C84D8"/>
  <rect x="242" y="201" width="22" height="79" rx="2" fill="#515C68"/>
  <text x="239" y="298" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Outbound</text>
  <text x="239" y="322" font-family="'JetBrains Mono',monospace" font-size="9" fill="#D07070" text-anchor="middle">−27 %</text>

  <!-- Group 3: Partenaires — réalisé=2.1M(151px), obj=1.8M(130px) — over target -->
  <rect x="324" y="129" width="22" height="151" rx="2" fill="#8C84D8"/>
  <rect x="350" y="150" width="22" height="130" rx="2" fill="#515C68"/>
  <text x="347" y="298" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Partner</text>
  <text x="347" y="322" font-family="'JetBrains Mono',monospace" font-size="9" fill="#03CF65" text-anchor="middle">+17 %</text>

  <!-- Group 4: Événements — réalisé=0.6M(43px), obj=0.7M(50px) — under target -->
  <rect x="432" y="237" width="22" height="43" rx="2" fill="#8C84D8"/>
  <rect x="458" y="230" width="22" height="50" rx="2" fill="#515C68"/>
  <text x="455" y="298" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Events</text>
  <text x="455" y="322" font-family="'JetBrains Mono',monospace" font-size="9" fill="#D07070" text-anchor="middle">−14 %</text>

  <!-- Group 5: Paid — réalisé=0.9M(65px), obj=0.9M(65px) — on target -->
  <rect x="540" y="215" width="22" height="65" rx="2" fill="#8C84D8"/>
  <rect x="566" y="215" width="22" height="65" rx="2" fill="#515C68"/>
  <text x="563" y="298" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Paid</text>
  <text x="563" y="322" font-family="'JetBrains Mono',monospace" font-size="9" fill="#03CF65" text-anchor="middle">=</text>

  <!-- Bottom separator -->
  <line x1="70" y1="336" x2="610" y2="336" stroke="#2B3543" stroke-width="1"/>
  <text x="70" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8">Gesamt-Pipeline Q3: </text>
  <text x="193" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#EDF1F4">8,7 Mio. €</text>
  <text x="240" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8"> · durchschn. Abschlussquote: </text>
  <text x="420" y="358" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#EDF1F4">23 %</text>
</svg>
