<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg">
  <title>Analyse corrélations RH — IA</title>
  <desc>Graphique de double tendance corrélation absentéisme et turnover avec annotation IA prédictive</desc>
  <!-- Card background -->
  <rect x="40" y="24" width="600" height="392" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header title -->
  <text x="70" y="58" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">HR correlation analysis — AI</text>
  <!-- Tag top-right -->
  <text x="610" y="58" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8C84D8" text-anchor="end">PREDICTIVE</text>
  <!-- Separator -->
  <line x1="70" y1="78" x2="610" y2="78" stroke="#2B3543" stroke-width="1"/>

  <!-- Chart area: x=110..590, y=90..290 -->
  <!-- Y axis left: Absentéisme 2%–6% (range 4, baseline at y=290=2%, top at y=90=6%) -->
  <!-- Y axis right: Turnover 8%–16% (range 8, same pixel space) -->
  <!-- Grid lines (5 horizontal lines at 2,3,4,5,6% on left axis) -->
  <line x1="110" y1="290" x2="590" y2="290" stroke="#28323F" stroke-width="1"/>
  <line x1="110" y1="240" x2="590" y2="240" stroke="#28323F" stroke-width="1"/>
  <line x1="110" y1="190" x2="590" y2="190" stroke="#28323F" stroke-width="1"/>
  <line x1="110" y1="140" x2="590" y2="140" stroke="#28323F" stroke-width="1"/>
  <line x1="110" y1="90" x2="590" y2="90" stroke="#28323F" stroke-width="1"/>

  <!-- Y-axis left labels (absentéisme %) -->
  <text x="104" y="293" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">2%</text>
  <text x="104" y="243" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">3%</text>
  <text x="104" y="193" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">4%</text>
  <text x="104" y="143" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">5%</text>
  <text x="104" y="93" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="end">6%</text>
  <!-- Left axis label -->
  <text x="68" y="195" font-family="'JetBrains Mono',monospace" font-size="9" fill="#03CF65" text-anchor="middle" transform="rotate(-90 68 195)">Absenteeism %</text>

  <!-- Y-axis right labels (turnover %) -->
  <text x="596" y="293" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F">8%</text>
  <text x="596" y="243" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F">10%</text>
  <text x="596" y="193" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F">12%</text>
  <text x="596" y="143" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F">14%</text>
  <text x="596" y="93" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F">16%</text>

  <!-- X-axis months: 6 points spaced evenly from x=110 to x=590 → step = 96 -->
  <!-- Points at x: 110, 206, 302, 398, 494, 590 -->
  <text x="110" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Jan</text>
  <text x="206" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Feb</text>
  <text x="302" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Mar</text>
  <text x="398" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Apr</text>
  <text x="494" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">May</text>
  <text x="590" y="308" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Jun</text>

  <!-- Line 1: Absentéisme — 3.2, 3.4, 3.8, 4.1, 4.5, 4.8% -->
  <!-- Scale: pixel = 290 - (val - 2) * 50 -->
  <!-- 3.2 → 290-60=230, 3.4 → 290-70=220, 3.8 → 290-90=200, 4.1 → 290-105=185, 4.5 → 290-125=165, 4.8 → 290-140=150 -->
  <polyline points="110,230 206,220 302,200 398,185 494,165 590,150" fill="none" stroke="#03CF65" stroke-width="2"/>
  <circle cx="110" cy="230" r="4" fill="#03CF65"/>
  <circle cx="206" cy="220" r="4" fill="#03CF65"/>
  <circle cx="302" cy="200" r="4" fill="#03CF65"/>
  <circle cx="398" cy="185" r="4" fill="#03CF65"/>
  <circle cx="494" cy="165" r="4" fill="#03CF65"/>
  <circle cx="590" cy="150" r="4" fill="#03CF65"/>

  <!-- Line 2: Turnover — 10.1, 10.4, 11.2, 11.8, 12.1, 12.4% -->
  <!-- Scale: pixel = 290 - (val - 8) * 25 -->
  <!-- 10.1 → 290-52.5=237, 10.4 → 290-60=230, 11.2 → 290-80=210, 11.8 → 290-95=195, 12.1 → 290-102.5=187, 12.4 → 290-110=180 -->
  <polyline points="110,237 206,230 302,210 398,195 494,187 590,180" fill="none" stroke="#8C84D8" stroke-width="2"/>
  <circle cx="110" cy="237" r="4" fill="#8C84D8"/>
  <circle cx="206" cy="230" r="4" fill="#8C84D8"/>
  <circle cx="302" cy="210" r="4" fill="#8C84D8"/>
  <circle cx="398" cy="195" r="4" fill="#8C84D8"/>
  <circle cx="494" cy="187" r="4" fill="#8C84D8"/>
  <circle cx="590" cy="180" r="4" fill="#8C84D8"/>

  <!-- AI annotation box -->
  <rect x="340" y="92" width="240" height="102" rx="6" fill="#1A2A1A" stroke="#03CF65" stroke-width="1"/>
  <text x="356" y="110" font-family="'JetBrains Mono',monospace" font-size="9" letter-spacing="1" fill="#03CF65">★ SIGNAL DETECTED</text>
  <line x1="356" y1="116" x2="568" y2="116" stroke="#03CF65" stroke-width="0.5" opacity="0.4"/>
  <text x="356" y="130" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#C3CCD6">Correlation 0.87 between absenteeism</text>
  <text x="356" y="144" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#C3CCD6">and turnover</text>
  <text x="356" y="160" font-family="-apple-system,'Inter',sans-serif" font-size="10" fill="#8C99A8">Population: managers 30-40, Ops BU</text>
  <text x="356" y="176" font-family="-apple-system,'Inter',sans-serif" font-size="10" fill="#8C99A8">Recommendation: management action</text>

  <!-- Legend -->
  <line x1="70" y1="326" x2="610" y2="326" stroke="#2B3543" stroke-width="1"/>
  <circle cx="80" cy="340" r="4" fill="#03CF65"/>
  <text x="90" y="344" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Absenteeism %</text>
  <circle cx="210" cy="340" r="4" fill="#8C84D8"/>
  <text x="220" y="344" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Turnover %</text>
  <text x="610" y="344" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F" text-anchor="end">Correlation over a 12-month rolling window</text>
</svg>
