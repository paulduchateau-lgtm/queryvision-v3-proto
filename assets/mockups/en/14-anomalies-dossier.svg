  <rect x="200" y="116" width="355" height="22" rx="3" fill="#B24B4B" fill-opacity="0.12"/>
  <rect x="200" y="116" width="355" height="22" rx="3" fill="#B24B4B" fill-opacity="0.85"/>
  <text x="562" y="131" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D07070">12</text>

  <!-- Row 2: Écarts de montant · 8 (amber) -->
  <text x="196" y="172" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6" text-anchor="end">Amount discrepancies</text>
  <rect x="200" y="158" width="355" height="22" rx="3" fill="#C89432" fill-opacity="0.10"/>
  <rect x="200" y="158" width="237" height="22" rx="3" fill="#C89432" fill-opacity="0.75"/>
  <text x="444" y="173" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C89432">8</text>

  <!-- Row 3: Doublons exacts · 7 (red) -->
