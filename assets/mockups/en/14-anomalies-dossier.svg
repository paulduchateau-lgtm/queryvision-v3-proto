  <rect x="200" y="200" width="355" height="22" rx="3" fill="#B24B4B" fill-opacity="0.10"/>
  <rect x="200" y="200" width="207" height="22" rx="3" fill="#B24B4B" fill-opacity="0.65"/>
  <text x="414" y="215" font-family="'JetBrains Mono',monospace" font-size="12" fill="#D07070">7</text>

  <!-- Row 4: Factures sans BC · 5 (muted) -->
  <text x="196" y="256" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#C3CCD6" text-anchor="end">Invoices without PO</text>
  <rect x="200" y="242" width="355" height="22" rx="3" fill="#67737F" fill-opacity="0.10"/>
  <rect x="200" y="242" width="148" height="22" rx="3" fill="#67737F" fill-opacity="0.55"/>
  <text x="355" y="257" font-family="'JetBrains Mono',monospace" font-size="12" fill="#8C99A8">5</text>

