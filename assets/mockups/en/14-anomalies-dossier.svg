  <text x="70" y="94" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">3,847 invoices analyzed · 5 categories · ML model v2.4 · 94% confidence</text>

  <!-- Bar chart — max=12, x=200→555 (355px), 1 unit ≈ 29.6px -->

  <!-- Row 1: Doublons probables · 12 (red) -->
