  <!-- AI interpretation block -->
  <rect x="70" y="322" width="540" height="48" rx="8" fill="#1A2B3A" stroke="#293A4A" stroke-width="1"/>
  <text x="86" y="338" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" letter-spacing="1">AI ·</text>
  <text x="110" y="338" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#9BA4AE">19 critical anomalies (duplicates + discrepancies). ACME SAS and DELTA Tech: resolve before Q1 close.</text>
  <text x="86" y="356" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#6B7A8A">Ask: “Which suppliers have duplicates to review before March 31?”</text>

