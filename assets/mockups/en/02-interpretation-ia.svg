<svg width="680" height="348" viewBox="0 0 680 348" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Qvision AI interpretation panel mockup</title>
<desc>Dark blue-gray card showing an AI-generated executive summary and a list of findings with green square bullets.</desc>
<rect x="40" y="20" width="600" height="312" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
<path d="M76 56 l3 -8 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 z" fill="#03CF65"/>
<text x="96" y="62" font-family="'JetBrains Mono',monospace" font-size="12" letter-spacing="1.8" fill="#03CF65">AI INTERPRETATION</text>
<circle cx="588" cy="56" r="9" fill="none" stroke="#3A4757" stroke-width="1.2"/>
<circle cx="612" cy="56" r="9" fill="none" stroke="#3A4757" stroke-width="1.2"/>
<text x="70" y="100" font-family="Georgia,'Times New Roman',serif" font-size="17" fill="#EDF1F4">Executive summary</text>
<text x="70" y="128" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#B8C2CD">The analysis reveals a concentration of high-level</text>
<text x="70" y="150" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#B8C2CD">risk on a limited number of sites, with a marked</text>
<text x="70" y="172" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#B8C2CD">predominance of two regional hubs.</text>
<text x="70" y="210" font-family="Georgia,'Times New Roman',serif" font-size="16" fill="#EDF1F4">Key findings</text>
<rect x="70" y="226" width="7" height="7" rx="1" fill="#03CF65"/>
<text x="86" y="233" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#C3CCD6">Concentration: two sites carry nearly 50% of aggregate risk.</text>
<rect x="70" y="254" width="7" height="7" rx="1" fill="#03CF65"/>
<text x="86" y="261" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#C3CCD6">Disparity: wide gap between leading and residual sites.</text>
<rect x="70" y="282" width="7" height="7" rx="1" fill="#03CF65"/>
<text x="86" y="289" font-family="-apple-system,'Inter',sans-serif" font-size="13" fill="#C3CCD6">Trend: average raw score rising over the fiscal year.</text>
<line x1="70" y1="308" x2="610" y2="308" stroke="#2B3543" stroke-width="1"/>
<text x="610" y="324" text-anchor="end" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F">automatically generated</text>
</svg>
