<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <title>Recommendation implementation</title>
  <desc>Grouped bar chart: recommendation implementation rate across 3 engagements</desc>
  <!-- Card background -->
  <rect x="40" y="16" width="600" height="368" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header title -->
  <text x="70" y="50" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Recommendation implementation</text>
  <!-- Tag top-right -->
  <text x="610" y="50" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8C99A8" text-anchor="end">Δ ENGAGEMENT</text>
  <!-- Separator -->
  <line x1="70" y1="66" x2="610" y2="66" stroke="#2B3543" stroke-width="1"/>

  <!-- Legend -->
  <rect x="70" y="76" width="10" height="10" fill="#515C68"/>
  <text x="86" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Engagement N-2</text>
  <rect x="168" y="76" width="10" height="10" fill="#8C84D8"/>
  <text x="184" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Engagement N-1</text>
  <rect x="268" y="76" width="10" height="10" fill="#03CF65"/>
  <text x="284" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">Engagement N</text>

  <!-- Chart area: y=300 is baseline (0%), y=100 is top (100%) -->
  <!-- Grid lines -->
  <line x1="100" y1="300" x2="610" y2="300" stroke="#28323F" stroke-width="1"/>
  <line x1="100" y1="250" x2="610" y2="250" stroke="#28323F" stroke-width="1"/>
  <line x1="100" y1="200" x2="610" y2="200" stroke="#28323F" stroke-width="1"/>
  <line x1="100" y1="150" x2="610" y2="150" stroke="#28323F" stroke-width="1"/>
  <line x1="100" y1="100" x2="610" y2="100" stroke="#28323F" stroke-width="1"/>

  <!-- Y-axis labels -->
  <text x="92" y="303" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F" text-anchor="end">0%</text>
  <text x="92" y="253" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F" text-anchor="end">25%</text>
  <text x="92" y="203" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F" text-anchor="end">50%</text>
  <text x="92" y="153" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F" text-anchor="end">75%</text>
  <text x="92" y="103" font-family="'JetBrains Mono',monospace" font-size="10" fill="#67737F" text-anchor="end">100%</text>

  <!-- Group 1: Contrôles internes — 52%, 71%, 89% -->
  <!-- N-2: 52% = 104px height -->
  <rect x="116" y="196" width="22" height="104" rx="2" fill="#515C68"/>
  <!-- N-1: 71% = 142px height -->
  <rect x="142" y="158" width="22" height="142" rx="2" fill="#8C84D8"/>
  <!-- N: 89% = 178px height -->
  <rect x="168" y="122" width="22" height="178" rx="2" fill="#03CF65"/>
  <text x="163" y="318" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Int. controls</text>

  <!-- Group 2: Processus — 45%, 63%, 78% -->
  <rect x="228" y="210" width="22" height="90" rx="2" fill="#515C68"/>
  <rect x="254" y="174" width="22" height="126" rx="2" fill="#8C84D8"/>
  <rect x="280" y="144" width="22" height="156" rx="2" fill="#03CF65"/>
  <text x="275" y="318" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Processes</text>

  <!-- Group 3: SI & Données — 38%, 55%, 72% -->
  <rect x="340" y="224" width="22" height="76" rx="2" fill="#515C68"/>
  <rect x="366" y="190" width="22" height="110" rx="2" fill="#8C84D8"/>
  <rect x="392" y="156" width="22" height="144" rx="2" fill="#03CF65"/>
  <text x="387" y="318" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">IT &amp; Data</text>

  <!-- Group 4: Conformité — 60%, 74%, 91% -->
  <rect x="452" y="180" width="22" height="120" rx="2" fill="#515C68"/>
  <rect x="478" y="152" width="22" height="148" rx="2" fill="#8C84D8"/>
  <rect x="504" y="118" width="22" height="182" rx="2" fill="#03CF65"/>
  <text x="499" y="318" font-family="'JetBrains Mono',monospace" font-size="9" fill="#67737F" text-anchor="middle">Compliance</text>

  <!-- Bottom separator -->
  <line x1="70" y1="330" x2="610" y2="330" stroke="#2B3543" stroke-width="1"/>
  <text x="70" y="352" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#03CF65">Engagement N average rate: 83%</text>
  <text x="238" y="352" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8"> (+14 pts vs N-1)</text>
</svg>
