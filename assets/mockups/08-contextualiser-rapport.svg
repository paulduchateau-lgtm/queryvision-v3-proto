<svg width="680" height="674" viewBox="0 0 680 674" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Mockup contextualisation de rapport Qvision</title>
<desc>Carte bleu-gris foncé, flux conversationnel Pilot qui pose des questions pour personnaliser un rapport, avec une liste de villes.</desc>
