<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
  <title>Analyse masse salariale N vs N-1</title>
  <desc>Comparaison de la masse salariale par BU entre 2024 et 2025 avec barres horizontales groupées</desc>
  <!-- Card background -->
  <rect x="40" y="16" width="600" height="368" rx="16" fill="#1C2431" stroke="#303B4D" stroke-width="1"/>
  <!-- Header title -->
  <text x="70" y="50" font-family="Georgia,'Times New Roman',serif" font-size="19" fill="#EDF1F4">Analyse masse salariale</text>
  <!-- Tag top-right -->
  <text x="610" y="50" font-family="'JetBrains Mono',monospace" font-size="11" letter-spacing="1.5" fill="#8C99A8" text-anchor="end">N vs N-1</text>
  <!-- Separator -->
  <line x1="70" y1="66" x2="610" y2="66" stroke="#2B3543" stroke-width="1"/>

  <!-- Legend -->
  <rect x="70" y="76" width="10" height="10" fill="#515C68"/>
  <text x="86" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">2024</text>
  <rect x="132" y="76" width="10" height="10" fill="#8C84D8"/>
  <text x="148" y="86" font-family="-apple-system,'Inter',sans-serif" font-size="11" fill="#8C99A8">2025</text>

  <!-- Max value = 82.4M → max bar width = 350px, scale = 350/82.4 = 4.25 px/M€ -->
  <!-- France: 2024=78.2M → 332px, 2025=82.4M → 350px -->
  <text x="130" y="114" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8" text-anchor="end">France</text>
  <rect x="138" y="102" width="332" height="13" rx="2" fill="#515C68" fill-opacity="0.7"/>
  <rect x="138" y="118" width="350" height="13" rx="2" fill="#8C84D8" fill-opacity="0.8"/>
  <text x="494" y="113" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C99A8">  78,2 M€</text>
  <text x="494" y="129" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C84D8">  82,4 M€</text>
  <text x="610" y="121" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="end">+5,4%</text>

  <!-- Allemagne: 2024=42.1M → 179px, 2025=44.8M → 190px -->
  <text x="130" y="162" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8" text-anchor="end">Allemagne</text>
  <rect x="138" y="150" width="179" height="13" rx="2" fill="#515C68" fill-opacity="0.7"/>
  <rect x="138" y="166" width="190" height="13" rx="2" fill="#8C84D8" fill-opacity="0.8"/>
  <text x="322" y="161" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C99A8">  42,1 M€</text>
  <text x="333" y="177" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C84D8">  44,8 M€</text>
  <text x="610" y="169" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="end">+6,4%</text>

  <!-- Espagne: 2024=28.7M → 122px, 2025=29.3M → 124px -->
  <text x="130" y="210" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8" text-anchor="end">Espagne</text>
  <rect x="138" y="198" width="122" height="13" rx="2" fill="#515C68" fill-opacity="0.7"/>
  <rect x="138" y="214" width="124" height="13" rx="2" fill="#8C84D8" fill-opacity="0.8"/>
  <text x="264" y="209" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C99A8">  28,7 M€</text>
  <text x="266" y="225" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C84D8">  29,3 M€</text>
  <text x="610" y="217" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="end">+2,1%</text>

  <!-- Benelux: 2024=19.4M → 82px, 2025=21.6M → 92px -->
  <text x="130" y="258" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8" text-anchor="end">Benelux</text>
  <rect x="138" y="246" width="82" height="13" rx="2" fill="#515C68" fill-opacity="0.7"/>
  <rect x="138" y="262" width="92" height="13" rx="2" fill="#8C84D8" fill-opacity="0.8"/>
  <text x="224" y="257" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C99A8">  19,4 M€</text>
  <text x="234" y="273" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C84D8">  21,6 M€</text>
  <text x="610" y="265" font-family="'JetBrains Mono',monospace" font-size="10" fill="#C89432" text-anchor="end">+11,3%</text>

  <!-- UK: 2024=15.8M → 67px, 2025=16.1M → 68px -->
  <text x="130" y="306" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8C99A8" text-anchor="end">UK</text>
  <rect x="138" y="294" width="67" height="13" rx="2" fill="#515C68" fill-opacity="0.7"/>
  <rect x="138" y="310" width="68" height="13" rx="2" fill="#8C84D8" fill-opacity="0.8"/>
  <text x="209" y="305" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C99A8">  15,8 M€</text>
  <text x="210" y="321" font-family="'JetBrains Mono',monospace" font-size="10" fill="#8C84D8">  16,1 M€</text>
  <text x="610" y="313" font-family="'JetBrains Mono',monospace" font-size="10" fill="#03CF65" text-anchor="end">+1,9%</text>

  <!-- Bottom separator -->
  <line x1="70" y1="340" x2="610" y2="340" stroke="#2B3543" stroke-width="1"/>
  <text x="70" y="362" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8">Total groupe 2025 : </text>
  <text x="192" y="362" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#EDF1F4">194,2 M€</text>
  <text x="262" y="362" font-family="-apple-system,'Inter',sans-serif" font-size="12" fill="#8C99A8"> · +5,7% vs 2024</text>
</svg>
